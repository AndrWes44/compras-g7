name: Pruebas de la aplicación

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Instalar dependencias del backend
        run: npm ci --prefix backend --ignore-scripts
      - name: Instalar dependencias del frontend
        run: npm ci --prefix frontend --ignore-scripts
      - name: Pruebas del backend
        run: npm test --prefix backend
      - name: Pruebas del frontend
        run: npm test --prefix frontend
      - name: Integración HTTP y validación de destinos locales
        run: node --test testing/api.integration.test.mjs testing/verify-dynamodb-local.test.mjs
